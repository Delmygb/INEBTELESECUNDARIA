<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registrar estudiante</title>
  <link rel="stylesheet" th:href="@{/estilos.css}" />
</head>
<body>
<main>
  <h1>INSTITUTO NACIONAL DE EDUCACIÓN BÁSICA TELESECUNDARIA</h1>
  <h2>Registrar un estudiante</h2>
  <form th:action="@{/estudiantes}" th:object="${estudiante}" method="post">
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" th:field="*{nombre}" required />

    <label for="edad">Edad</label>
    <input type="number" id="edad" th:field="*{edad}" required />

    <label for="estado">Estado de la tablet</label>
    <select id="estado" th:field="*{estadodelatablet}">
      <option value="Tablet en buen estado">Tablet en buen estado</option>
      <option value="No enciende">No enciende</option>
      <option value="Descargada">Descargada</option>
    </select>

    <button type="submit">Guardar</button>
  </form>
  <p><a th:href="@{/estudiantes}">Ver la lista de estudiantes</a></p>
</main>
</body>
</html>
