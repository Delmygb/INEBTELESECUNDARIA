<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inscribir Estudiante</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>
<main>
    <h1>INSTITUTO NACIONAL DE EDUCACIÓN BÁSICA TELESECUNDARIA</h1>
    <h2>Aldea Panabajal, San Juan Comalapa, Chimaltenango</h2>

    <h3>Inscribir Estudiante</h3>

    <form th:action="@{/estudiantes}" th:object="${estudiante}" method="post">
        <div>
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" th:field="*{nombre}" required>
        </div>
        <div>
            <label>
                <input type="checkbox" th:field="*{tienetableta}"> ¿Tiene tableta asignada?
            </label>
        </div>
        <div style="margin-top: 20px;">
            <button type="submit">Guardar Estudiante</button>
        </div>
    </form>

    <p style="margin-top: 20px;"><a th:href="@{/estudiantes}">Regresar a la lista</a></p>
</main>
</body>
</html>
