<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registrar estudiante</title>
    <link rel="stylesheet" th:href="@{/estilos.css}" />
</head>
<body>
<main>
    <h1>INSTITUTO NACIONAL DE EDUCACIÓN BÁSICA TELESECUNDARIA</h1>
    <h2>Registrar un estudiante</h2>

    <form th:action="@{/estudiantes}" th:object="${estudiante}" method="post">
        
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" th:field="*{nombre}" required />

        <label for="codigo">Código:</label>
        <input type="text" id="codigo" th:field="*{codigo}" required />

        <label for="anioEscolar">Año Escolar:</label>
        <input type="number" id="anioEscolar" th:field="*{anioEscolar}" required />

        <label for="tienetableta">
            <input type="checkbox" id="tienetableta" th:field="*{tienetableta}" />
            ¿Tiene tablet asignada?
        </label>

        <button type="submit">Guardar</button>
    </form>

    <p><a th:href="@{/estudiantes}">Ver la lista de estudiantes</a></p>
</main>
</body>
</html>
