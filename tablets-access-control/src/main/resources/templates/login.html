<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión - Control de Tabletas</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<main>
    <h1>INSTITUTO NACIONAL DE EDUCACIÓN BÁSICA TELESECUNDARIA</h1>
    <h2>Aldea Panabajal, San Juan Comalapa, Chimaltenango</h2>
    
    <h3>Iniciar sesión</h3>

    <div th:if="${param.error}" style="color: #a71d2a; margin-bottom: 12px; font-size: 0.9rem;">
        Usuario o contraseña incorrectos.
    </div>

    <form th:action="@{/login}" method="post">
        <div>
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>
        <div>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div>
            <button type="submit">Entrar</button>
        </div>
    </form>
</main>
</body>
</html>
