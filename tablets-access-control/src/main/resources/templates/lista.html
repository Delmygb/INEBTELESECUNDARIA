<!DOCTYPE html>
<html lang="es" 
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estudiantes inscritos</title>
  <link rel="stylesheet" th:href="@{/estilos.css}" />
</head>
<body>
<main>
  <h1>INSTITUTO NACIONAL DE EDUCACIÓN BÁSICA TELESECUNDARIA</h1>
  <h2>Aldea Panabajal, San Juan Comalapa, Chimaltenango</h2>

  <div class="barra">
    <span>Sesión de: <strong sec:authentication="name">usuario</strong></span>
    <form th:action="@{/logout}" method="post" class="en-linea">
      <button type="submit" class="secundario">Cerrar sesión</button>
    </form>
  </div>

  <p>Total registrados: <strong th:text="${total}">0</strong></p>
  <p th:if="${total == 0}">Todavía no hay estudiantes registrados.</p>

  <p sec:authorize="hasRole('ADMIN')"><a th:href="@{/estudiantes/nuevo}">+ Inscribir estudiante</a></p>

  <table th:if="${total > 0}">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Tiene tableta en buen estado</th>
        <th>Cambiar tableta</th>
        <th sec:authorize="hasRole('ADMIN')">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="estudiante : ${estudiantes}">
        <td th:text="${estudiante.nombre}">Nombre</td>
        <td th:text="${estudiante.tienetableta ? 'Sí' : 'No'}">Sí</td>
        <td>-</td>
        <td sec:authorize="hasRole('ADMIN')">
          <a th:href="@{/estudiantes/{id}/editar(id=${estudiante.id})}">Editar</a>
          <form th:action="@{/estudiantes/{id}/eliminar(id=${estudiante.id})}" method="post" class="en-linea">
            <button type="submit" class="peligro">Eliminar</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
