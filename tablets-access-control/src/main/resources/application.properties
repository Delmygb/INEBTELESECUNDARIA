spring.application.name=tablets-access-control
spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false

# Conexión directa a PostgreSQL usando las variables de Render
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate para persistencia permanente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Contraseñas de acceso
app.admin.password=${ADMIN_PASSWORD}
app.entrenador.password=${ENTRENADOR_PASSWORD}