spring.application.name=tablets-access-control
spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false

# Conexión a Neon PostgreSQL mediante Variables de Entorno de Render
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate para persistencia permanente sin perder datos
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Contraseñas iniciales leídas de variables de entorno
app.admin.password=${ADMIN_PASSWORD}
app.entrenador.password=${ENTRENADOR_PASSWORD}

# Puerto asignado para Render
server.port=${PORT:8080}